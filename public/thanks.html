<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <title>送信ありがとうございました | FANTASISTA 60周年FESTA</title>
    <meta name="description" content="FANTASISTA 60周年FESTA 参加意向フォームの送信完了ページです。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/pages.css" />
    <link rel="stylesheet" href="./assets/css/enhancements.css" />
    <style>
      .thanks-hero {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 88px 0;
        background:
          radial-gradient(circle at 18% 12%, rgba(254, 192, 0, 0.18), transparent 28%),
          radial-gradient(circle at 84% 18%, rgba(144, 31, 41, 0.18), transparent 28%),
          linear-gradient(180deg, #16191f 0%, #21252d 100%);
        color: #fff;
      }

      .thanks-card {
        width: min(calc(100% - 40px), 760px);
        padding: clamp(28px, 5vw, 48px);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.26);
      }

      .thanks-card h1 {
        margin: 0 0 18px;
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1.12;
      }

      .thanks-card p {
        color: rgba(255, 255, 255, 0.84);
        line-height: 1.85;
      }

      .thanks-actions {
        margin-top: 28px;
      }
    </style>
  </head>
  <body>
    <main class="thanks-hero">
      <section class="thanks-card" aria-labelledby="thanks-title">
        <p class="section-head__kicker">FANTASISTA 60th FESTA</p>
        <h1 id="thanks-title">送信ありがとうございました。</h1>
        <p>内容を確認のうえ、必要に応じてFANTASISTA 60周年FESTA事務局よりご連絡します。</p>
        <p>正式な参加登録、会費、入金方法については後日あらためてご案内します。</p>
        <div class="thanks-actions">
          <a class="button button--primary" href="./">トップページへ戻る</a>
        </div>
      </section>
    </main>
    <script src="./assets/js/site.js" defer></script>
  </body>
</html>
